<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert Primavera P6 XER schedules to standard, Enhanced Power BI, Programme Review, or Tender Review CSV bundles." />
    <meta name="theme-color" content="#1666aa" />
    <meta name="application-version" content="__APP_VERSION__" />
    <title>XER to CSV Converter</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css?v=__APP_VERSION__" />
</head>
<body>
    <div id="app">
        <div class="loading-screen" role="status" aria-label="Loading application">
            <div class="spinner" aria-hidden="true"></div>
            <p>Loading XER to CSV Converter...</p>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss" aria-label="Dismiss error">Dismiss</a>
    </div>

    <script src="js/browserLocalDate.js?v=__APP_VERSION__"></script>
    <script src="js/downloads.js?v=__APP_VERSION__"></script>
    <script src="_framework/blazor.webassembly.js?v=__APP_VERSION__"></script>
    <script>
        window.scrollToBottom = (element) => {
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        };
    </script>
</body>
</html>
