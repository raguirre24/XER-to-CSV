name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.421'

      - name: Install pinned WebAssembly workloads
        run: dotnet workload install wasm-tools wasm-experimental --skip-manifest-update

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate parser and browser lifecycle
        run: |
          dotnet test XerToCsvConverter.Core.Tests/XerToCsvConverter.Core.Tests.csproj -c Release
          dotnet test XerToCsvConverter.TenderReview.Cli/Tests/XerToCsvConverter.TenderReview.Surface.Tests.csproj -c Release
          dotnet test XerToCsvConverter.RelationshipAudit.Cli/Tests/XerToCsvConverter.RelationshipAudit.Cli.Tests.csproj -c Release
          node --test XerToCsvConverter.Web/tests/*.test.cjs
          git diff --check

      - name: Publish Blazor WASM
        run: dotnet publish XerToCsvConverter.Web/XerToCsvConverter.Web.csproj -c Release -p:PublishProfile= -o release

      - name: Adjust base path for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/XER-to-CSV/" />|g' release/wwwroot/index.html
          sed -i "s|__APP_VERSION__|${GITHUB_SHA}|g" release/wwwroot/index.html
          sed -i "s|__APP_VERSION__|${GITHUB_SHA}|g" release/wwwroot/worker/main.js

      - name: Verify packaged UI and worker
        run: |
          test -s release/wwwroot/_framework/blazor.boot.json
          test -s release/wwwroot/worker/main.js
          test -s release/wwwroot/worker/fileInput.js
          test -s release/wwwroot/worker/_framework/dotnet.js
          test -s release/wwwroot/worker/_framework/blazor.boot.json
          grep -q 'base href="/XER-to-CSV/"' release/wwwroot/index.html
          grep -qF "$GITHUB_SHA" release/wwwroot/index.html
          grep -qF "$GITHUB_SHA" release/wwwroot/worker/main.js

      - name: Add .nojekyll
        run: touch release/wwwroot/.nojekyll

      - name: Copy 404.html for client-side routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
